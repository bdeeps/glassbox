# Posts a box to Buffer from GitHub, for when you're away from your laptop.
# Needs the BUFFER_API_KEY repository secret. Reads the box's live post.json.
name: Post a box
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Box slug (e.g. cameraclear)
        required: true
      mode:
        description: schedule = post.json time, queue = Buffer queue, now = immediately
        type: choice
        options: [schedule, queue, now]
        default: schedule
      dry:
        description: Dry run (show the posts, send nothing)
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SLUG: ${{ inputs.slug }}
          MODE: ${{ inputs.mode }}
          DRY: ${{ inputs.dry }}
        run: |
          flags=""
          [ "$MODE" = "queue" ] && flags="$flags --queue"
          [ "$MODE" = "now" ] && flags="$flags --now"
          [ "$DRY" = "true" ] && flags="$flags --dry"
          node scripts/post.mjs "$SLUG" $flags
      - name: Record what was posted
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "glassbox-bot"
          git config user.email "glassbox-bot@users.noreply.github.com"
          git add posted
          git diff --cached --quiet || (git commit -m "Posted ${{ inputs.slug }}" && git push)
