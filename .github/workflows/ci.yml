# Builds the hub from every public box repo, as the server does, to catch
# broken manifests before Railway deploys. Railway deploys main on its own.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in scripts/*.mjs scripts/lib/*.mjs site/assets/*.js site/studio/*.js; do node --check "$f"; done
      - run: node scripts/build.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
