# Optional: rebuild the Glassbox hub as soon as this box changes, instead of
# waiting for the hub's hourly rebuild. Needs a HUB_DISPATCH_TOKEN secret: a
# fine-grained token with "Contents: read and write" on the hub repo.
name: Notify hub
on:
  push:
    branches: [main]
    paths: ['glassbox.json', 'glassbox/**']
jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
    steps:
      - if: env.TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/{{ORG}}/{{HUB_REPO}}/dispatches \
            -d '{"event_type":"box-updated","client_payload":{"slug":"{{SLUG}}"}}'
